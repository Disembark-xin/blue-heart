const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
let width=innerWidth,height=innerHeight,phase='loading',elapsed=0,lastTime=performance.now();
let paused=true,firstFrame=null,lastFrame=null,firstPoints=[],lastPoints=[],dots=[],completedLoops=0;
let videoReady=false,photoReady=false;
const clamp=v=>Math.max(0,Math.min(1,v));
const ease=v=>{v=clamp(v);return v*v*(3-2*v)};
const mix=(a,b,t)=>a+(b-a)*t;
function fit(w,h,maxW=width,maxH=height){const s=Math.min(maxW/w,maxH/h);return {x:(width-w*s)/2,y:(height-h*s)/2,w:w*s,h:h*s}}
function photoRect(){return fit(photo.naturalWidth,photo.naturalHeight,Math.min(width-36,760),Math.max(100,height-170))}
function videoRect(){return fit(video.videoWidth||16,video.videoHeight||9)}
function setPhase(value){phase=value;elapsed=0;document.body.dataset.phase=value;document.body.dataset.loops=completedLoops}
function snapshot(){const c=document.createElement('canvas');c.width=480;c.height=Math.round(480*video.videoHeight/video.videoWidth);c.getContext('2d').drawImage(video,0,0,c.width,c.height);return c}
function sampleFrame(frame){
 const pixels=frame.getContext('2d').getImageData(0,0,frame.width,frame.height).data,points=[];
 for(let y=0;y<frame.height;y++)for(let x=0;x<frame.width;x++){
  const i=(y*frame.width+x)*4,r=pixels[i],g=pixels[i+1],b=pixels[i+2];
  if(Math.max(r,g,b)>65 && r+g+b>150)points.push({x:x/frame.width,y:y/frame.height,r,g,b});
 }
 if(!points.length)points.push({x:.5,y:.5,r:170,g:210,b:255});
 return points;
}
function makeDots(){
 const cols=width<600?58:86, rows=Math.round(cols*photo.naturalHeight/photo.naturalWidth);
 const sample=document.createElement('canvas');sample.width=cols;sample.height=rows;
 sample.getContext('2d').drawImage(photo,0,0,cols,rows);
 const rgb=sample.getContext('2d').getImageData(0,0,cols,rows).data;
 dots=[];
 for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
  const n=y*cols+x,i=n*4;
  dots.push({x:(x+.5)/cols,y:(y+.5)/rows,r:rgb[i],g:rgb[i+1],b:rgb[i+2],
   from:lastPoints[(n*7919)%lastPoints.length],to:firstPoints[(n*6151)%firstPoints.length],
   arc:Math.sin(n*12.9898)*Math.min(width,height)*.2,wave:Math.cos(n*7.17)*Math.min(width,height)*.14,
   delay:(n%19)/19*.13});
 }
 canvas.dataset.particleCount=String(dots.length);
}
function drawImage(image,rect,alpha=1){ctx.globalAlpha=clamp(alpha);ctx.drawImage(image,rect.x,rect.y,rect.w,rect.h);ctx.globalAlpha=1}
function background(){ctx.clearRect(0,0,width,height);ctx.fillStyle='#000000';ctx.fillRect(0,0,width,height)}
function renderParticles(progress,back){
 const p=photoRect(),v=videoRect(),cols=width<600?58:86;
 for(const d of dots){
  const t=ease((progress-d.delay)/(1-d.delay)),heart=back?d.to:d.from;
  const hx=v.x+heart.x*v.w,hy=v.y+heart.y*v.h,px=p.x+d.x*p.w,py=p.y+d.y*p.h;
  const morph=back?1-t:t,arc=Math.sin(t*Math.PI);
  const x=mix(hx,px,morph)+arc*d.arc,y=mix(hy,py,morph)+arc*d.wave;
  const r=Math.round(mix(heart.r,d.r,morph)),g=Math.round(mix(heart.g,d.g,morph)),b=Math.round(mix(heart.b,d.b,morph));
  const size=mix(width<600?1.25:1.6,p.w/cols+0.35,morph);
  ctx.fillStyle=`rgb(${r},${g},${b})`;ctx.fillRect(x-size/2,y-size/2,size,size);
 }
}
function render(){
 background();const p=photoRect(),v=videoRect();
 if(phase==='to-photo'){
  const t=clamp(elapsed/MORPH_MS);
  if(reducedMotion){drawImage(lastFrame,v,1-ease(t));drawImage(photo,p,ease(t))}
  else{renderParticles(t,false);if(t<.13)drawImage(lastFrame,v,1-t/.13);if(t>.86)drawImage(photo,p,ease((t-.86)/.14))}
 }else if(phase==='photo'){drawImage(photo,p)}
 else if(phase==='to-heart'){
  const t=clamp(elapsed/MORPH_MS);
  if(reducedMotion){drawImage(photo,p,1-ease(t));drawImage(firstFrame,v,ease(t))}
  else{renderParticles(t,true);if(t<.15)drawImage(photo,p,1-ease(t/.15));if(t>.86)drawImage(firstFrame,v,ease((t-.86)/.14))}
 }else if(phase==='resume'){drawImage(firstFrame,v);canvas.style.opacity=String(1-ease(elapsed/FADE_MS))}
}
async function startVideo(){
 if(paused || document.hidden)return;
 try{video.muted=true;await video.play();playVideo.hidden=true;maybeStart()}
 catch{playVideo.hidden=false;videoStatus.textContent=' · 请点击下方播放动画'}
}
function maybeStart(){
 if(video.readyState<2||!video.videoWidth||phase!=='loading')return;
 try{firstFrame=snapshot();firstPoints=sampleFrame(firstFrame);videoReady=true;setPhase('heart');videoStatus.textContent='';}
 catch{videoStatus.textContent=' · 动画正在准备，请稍候';}
}
for(const event of ['loadeddata','canplay','playing','timeupdate'])video.addEventListener(event,maybeStart);
video.addEventListener('timeupdate',()=>{if(!video.paused&&video.currentTime>.05){playVideo.hidden=true;videoStatus.textContent=''}});
video.addEventListener('waiting',()=>{videoStatus.textContent=' · 动画缓冲中';playVideo.hidden=false});
video.addEventListener('stalled',()=>{videoStatus.textContent=' · 动画加载缓慢，可点击下方重试';playVideo.hidden=false});
photo.onload=()=>{photoReady=true;maybeStart()};
if(photo.complete&&photo.naturalWidth){photoReady=true;maybeStart()}
photo.onerror=()=>{status.textContent='照片未能加载，请刷新页面。';video.loop=true;setPhase('heart');startVideo()};
video.addEventListener('ended',()=>{
 if(!photoReady){video.currentTime=0;startVideo();return;}
 lastFrame=snapshot();lastPoints=sampleFrame(lastFrame);makeDots();setPhase('to-photo');
 canvas.hidden=false;canvas.style.opacity='1';render();video.style.opacity='0';
});
video.addEventListener('error',()=>{videoStatus.textContent=' · 动画文件加载失败，请确认 heart.mp4 已上传';playVideo.hidden=false;playVideo.textContent='重新加载动画和音乐'});
let startBusy=false,lastTouch=0,playbackRequested=false;
async function startAllPlayback(event){
 if(event&&event.type==='touchend'){lastTouch=Date.now();event.preventDefault();event.stopPropagation()}
 if(event&&event.type==='click'&&Date.now()-lastTouch<800)return;
 if(startBusy)return;
 playbackRequested=true;paused=false;startBusy=true;
 playVideo.hidden=false;playVideo.textContent='正在加载动画和音乐…';
 status.textContent='正在启动，请稍候…';videoStatus.textContent='';
 if(video.error)video.load();video.muted=true;
 let videoTask,audioTask;
 try{videoTask=video.play()}catch(error){videoTask=Promise.reject(error)}
 try{audioTask=music.play()}catch(error){audioTask=Promise.reject(error)}
 await Promise.allSettled([Promise.resolve(videoTask),Promise.resolve(audioTask)]);
 maybeStart();
 const videoOK=!video.paused&&!video.error,audioOK=!music.paused;
 if(videoOK){playVideo.hidden=true}else{playVideo.hidden=false;playVideo.textContent='再次点击播放动画和音乐'}
 if(videoOK&&audioOK)status.textContent='正在播放 · 童话';
 else if(videoOK)status.textContent='动画已播放；音乐未启动，可点右上角播放音乐';
 else if(audioOK)status.textContent='音乐已播放；动画仍在加载，请点下方重试';
 else status.textContent='暂未启动，请再次点击下方按钮';
 syncMusic();startBusy=false;
}
playVideo.addEventListener('touchend',startAllPlayback,{passive:false});
playVideo.addEventListener('click',startAllPlayback);
video.addEventListener('playing',()=>{if(playbackRequested){playVideo.hidden=true;videoStatus.textContent=''}});
document.addEventListener('WeixinJSBridgeReady',()=>{if(playbackRequested&&(video.paused||music.paused))startAllPlayback()});
function resize(){width=innerWidth;height=innerHeight;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(!canvas.hidden)render()}
addEventListener('resize',resize);resize();
document.addEventListener('visibilitychange',()=>{lastTime=performance.now();if(document.hidden)video.pause();else if(!paused&&(phase==='heart'||phase==='resume'||phase==='loading'))startVideo()});
function tick(now){
 const dt=Math.min(now-lastTime,100);lastTime=now;
 if(phase==='loading')maybeStart();
 if(!paused&&!document.hidden&&phase!=='heart'&&phase!=='loading'){
  elapsed+=dt;
  if(phase==='to-photo'&&elapsed>=MORPH_MS)setPhase('photo');
  else if(phase==='photo'&&elapsed>=PHOTO_MS)setPhase('to-heart');
  else if(phase==='to-heart'&&elapsed>=MORPH_MS){video.currentTime=0;video.style.opacity='1';setPhase('resume');startVideo()}
  else if(phase==='resume'&&elapsed>=FADE_MS){completedLoops++;setPhase('heart');canvas.hidden=true;canvas.style.opacity='1'}
  if(!canvas.hidden)render();
 }
 requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
setPhase('loading');
setTimeout(()=>{if(playbackRequested&&(phase==='loading'||(phase==='heart'&&video.currentTime<.05))){playVideo.hidden=false;playVideo.textContent='再次点击播放动画和音乐';videoStatus.textContent=' · 若仍无画面，请关闭浏览器省流模式'}},8000);
music.volume=Number(volume.value);
volume.addEventListener('input',()=>{music.volume=Number(volume.value)});
function syncMusic(){const playing=!music.paused;toggle.textContent=playing?'♫ 暂停音乐':'♫ 播放音乐';toggle.setAttribute('aria-pressed',String(playing))}
music.addEventListener('play',syncMusic);music.addEventListener('pause',syncMusic);
music.addEventListener('error',()=>{status.textContent='音乐加载失败，请将 music.mp3 与网页放在同一目录。'});
toggle.addEventListener('click',async()=>{
 if(!music.paused){music.pause();syncMusic();status.textContent='音乐已暂停';return}
 toggle.disabled=true;
 try{await music.play();status.textContent='正在播放 · 童话'}
 catch{status.textContent='请再次点击播放；若仍无声音，请检查 music.mp3 是否上传。'}
 finally{toggle.disabled=false;syncMusic()}
});
</script>
</body>
</html>
